name: flavri
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - rdkit
  - pandas
  - openpyxl
  - numpy
  - scipy
  - tqdm
  - requests
  - pyyaml
  - scikit-learn
  - rich
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchvision==0.20.1+cu121
